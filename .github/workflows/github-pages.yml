name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/aai-foundation"
      - name: Keep _next assets on Pages
        run: touch out/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
      - name: Enable GitHub Pages from gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "gh-pages", path: "/" };
            try {
              await github.rest.repos.createPagesSite({ owner, repo, source });
              core.info("Enabled GitHub Pages on the gh-pages branch.");
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner,
                  repo,
                  source,
                });
                core.info("Updated GitHub Pages to the gh-pages branch.");
              } else {
                core.warning(error.message);
                core.warning(
                  "Enable Pages manually: Settings → Pages → Deploy from a branch → gh-pages / (root).",
                );
              }
            }
